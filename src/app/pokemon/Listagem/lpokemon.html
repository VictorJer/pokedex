<div class="container my-3">
  <div class="row g-3">
    @for (poke of listagemPokemon(); track poke.id) {
      <div class="col-md-6 col-lg-2">
        <div class="card p-3 text-center">
          <span class="fs-6 fw-medium card-title">{{ poke.displayName }}</span>

          <div class="d-flex justify-content-center gap-2">
            @for (tipo of poke.types; track tipo.name) {
              <span class="badge rouded-pill text-light" [style.background-color]="tipo.color">{{ tipo.displayName }}</span>
            }
          </div>
          @if (poke.imageUrl) {
            <img [src]="poke.imageUrl" [alt]="poke.imageAlt" />
          } @else {
            <p>Imagem não disponível</p>
          }
        </div>
      </div>
    }
  </div>
</div>
